<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline';">
<title>DeepSeek Monitor</title>
<link rel="stylesheet" href="../../node_modules/gridstack/dist/gridstack.min.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
<div class="resize-layer">
  <div class="resize-handle resize-n"></div>
  <div class="resize-handle resize-s"></div>
  <div class="resize-handle resize-e"></div>
  <div class="resize-handle resize-w"></div>
  <div class="resize-handle resize-ne"></div>
  <div class="resize-handle resize-nw"></div>
  <div class="resize-handle resize-se"></div>
  <div class="resize-handle resize-sw"></div>
</div>
<div id="app">
  <div class="titlebar">
    <div class="titlebar-left">
      <span class="titlebar-logo"> </span>
      <span class="titlebar-text">DeepSeek Monitor</span>
    </div>
    <div class="titlebar-actions">
      <button class="titlebar-btn" id="refreshBtn" title="立即刷新">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5b6372" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button class="titlebar-btn" id="settingsBtn" title="设置">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="#5b6372"><path d="M7.5 1a6.5 6.5 0 0 1 5.91 9.08l2.25 2.25a.75.75 0 1 1-1.06 1.06l-2.25-2.25A6.5 6.5 0 1 1 7.5 1zm0 1.5a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/><circle cx="7.5" cy="7.5" r="2.5"/></svg>
      </button>
      <button class="titlebar-btn" id="layoutEditBtn" title="编辑布局" aria-label="编辑布局" aria-pressed="false">
        <span class="layout-edit-icon" aria-hidden="true">▦</span>
      </button>
      <button class="titlebar-btn" id="minimizeBtn" title="最小化">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="#5b6372"><path d="M3 8.5a.75.75 0 0 1 .75-.75h8.5a.75.75 0 0 1 0 1.5h-8.5A.75.75 0 0 1 3 8.5z"/></svg>
      </button>
      <button class="titlebar-btn" id="closeBtn" title="关闭">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="#5b6372"><path d="M3.22 3.22a.75.75 0 0 1 1.06 0L8 6.94l3.72-3.72a.75.75 0 1 1 1.06 1.06L9.06 8l3.72 3.72a.75.75 0 1 1-1.06 1.06L8 9.06l-3.72 3.72a.75.75 0 0 1-1.06-1.06L6.94 8 3.22 4.28a.75.75 0 0 1 0-1.06z"/></svg>
      </button>
    </div>
  </div>

  <div class="content">
    <div class="grid-stack" id="dashboardGrid">
      <section class="component-wrapper grid-stack-item fee-card-widget" id="balance-card" data-component-id="balance-card" gs-id="balance-card">
        <div class="grid-stack-item-content component-surface fee-card-surface">
          <div class="component-title">余额</div>
          <div class="fee-card-content" id="balance-card-content"></div>
        </div>
      </section>
      <section class="component-wrapper grid-stack-item fee-card-widget" id="today-cost-card" data-component-id="today-cost-card" gs-id="today-cost-card">
        <div class="grid-stack-item-content component-surface fee-card-surface">
          <div class="component-title">今日消耗</div>
          <div class="fee-card-content" id="today-cost-card-content"></div>
        </div>
      </section>
      <section class="component-wrapper grid-stack-item fee-card-widget" id="cache-rate-card" data-component-id="cache-rate-card" gs-id="cache-rate-card">
        <div class="grid-stack-item-content component-surface fee-card-surface">
          <div class="component-title">缓存命中率</div>
          <div class="fee-card-content" id="cache-rate-card-content"></div>
        </div>
      </section>
      <section class="component-wrapper grid-stack-item chart-widget" id="model-bar" data-component-id="model-bar" gs-id="model-bar">
        <div class="grid-stack-item-content component-surface">
          <div class="component-title">每日 Token 消耗</div>
          <div class="chart-container" id="daily-chart"></div>
        </div>
      </section>
      <section class="component-wrapper grid-stack-item chart-widget" id="token-line" data-component-id="token-line" gs-id="token-line">
        <div class="grid-stack-item-content component-surface">
          <div class="component-header">
            <div class="component-title">Token 消耗</div>
            <select class="time-select" id="tokenTimeRange" style="display:none">
              <option value="30s">30 秒</option>
              <option value="1m" selected>分钟</option>
              <option value="1h">小时</option>
              <option value="1d">天</option>
            </select>
          </div>
          <div class="chart-container" id="token-chart"></div>
        </div>
      </section>
      <section class="component-wrapper grid-stack-item chart-widget" id="cost-line" data-component-id="cost-line" gs-id="cost-line">
        <div class="grid-stack-item-content component-surface">
          <div class="component-header">
            <div class="component-title">费用增长趋势</div>
            <select class="time-select" id="costTimeRange" style="display:none">
              <option value="30s">30 秒</option>
              <option value="1m" selected>分钟</option>
              <option value="1h">小时</option>
              <option value="1d">天</option>
            </select>
          </div>
          <div class="chart-container" id="cost-chart"></div>
        </div>
      </section>
    </div>
  </div>

  <div class="dashboard-empty" id="dashboardEmpty" hidden>
    <div class="dashboard-empty-title">&#26410;&#26174;&#31034;&#20219;&#20309;&#32452;&#20214;</div>
    <button class="titlebar-btn dashboard-empty-settings" id="emptySettingsBtn" title="&#25171;&#24320;&#35774;&#32622;" aria-label="&#25171;&#24320;&#35774;&#32622;">
      <span aria-hidden="true">&#9881;</span>
    </button>
  </div>

  <div class="statusbar">
    <div style="display:flex;align-items:center;">
      <span class="status-dot offline" id="statusDot"></span>
      <span id="statusText">未获取数据</span>
    </div>
    <span id="proxyPort">平台用量</span>
    <span id="apiKeyDisplay">
      <span id="refreshTime">--</span>
    </span>
  </div>
</div>

<script src="js/charts.js"></script>
<script src="js/layout/component-registry.js"></script>
<script src="js/layout/layout-policy.js"></script>
<script src="js/settings-definitions.js"></script>
<script src="js/components/fee-cards.js"></script>
<script src="js/components/model-bar.js"></script>
<script src="js/components/curve-chart.js"></script>
<script src="js/runtime/window-state.js"></script>
<script src="js/runtime/physics.js"></script>
<script src="js/runtime/constraint.js"></script>
<script src="js/runtime/runtime.js"></script>
<script src="js/runtime/commit-manager.js"></script>
<script src="../../node_modules/gridstack/dist/gridstack-all.js"></script>
<script src="js/layout/reflow-animator.js"></script>
<script src="js/layout/layout-controller.js"></script>
<script src="js/app.js"></script>
</body>
</html>
