<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Monitor - 登录</title>
<style>
  html {
    background: transparent;
    overflow: hidden;
    border-radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    font-size: 13px;
    background: transparent;
    overflow: hidden;
    height: 100vh;
    display: flex;
    border-radius: 16px;
  }
  .container {
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 16px;
    clip-path: inset(0 round 16px);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
    padding: 0 28px 32px;
  }
  .login-titlebar {
    -webkit-app-region: drag;
    padding: 12px 0 8px;
    text-align: center;
    flex-shrink: 0;
  }
  .login-titlebar-text {
    font-size: 11px;
    font-weight: 600;
    color: #6B7280;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .logo {
    font-size: 20px;
    font-weight: 700;
    color: #4D6BFE;
    margin-bottom: 4px;
    text-align: center;
  }
  .subtitle {
    font-size: 12px;
    color: #6B7280;
    text-align: center;
    margin-bottom: 24px;
  }
  .form-group { margin-bottom: 16px; }
  .form-label {
    font-size: 12px;
    font-weight: 600;
    color: #1A1A2E;
    margin-bottom: 6px;
    display: block;
  }
  .form-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #E5E7EB;
    border-radius: 8px;
    font-size: 13px;
    color: #1A1A2E;
    background: #F8F9FC;
    outline: none;
    font-family: monospace;
    transition: all 200ms ease-out;
  }
  .form-input:focus {
    border-color: #74B8FC;
    box-shadow: 0 0 0 2px rgba(116, 184, 252, 0.15);
  }
  .form-hint {
    font-size: 11px;
    color: #9CA3AF;
    margin-top: 4px;
  }
  .error-msg {
    font-size: 11px;
    color: #EF4444;
    margin-top: 4px;
    min-height: 16px;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: auto;
  }
  .btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 200ms ease-out;
  }
  .btn-primary {
    background: #4D6BFE;
    color: #FFFFFF;
  }
  .btn-primary:hover { background: #7B92FF; }
  .btn-primary:disabled { background: #9CA3AF; cursor: not-allowed; }
  .btn-secondary {
    background: transparent;
    color: #6B7280;
    border: 1px solid #E5E7EB;
  }
  .btn-secondary:hover { background: rgba(0, 0, 0, 0.03); }
</style>
</head>
<body>
<div class="container">
  <div class="login-titlebar">
    <span class="login-titlebar-text">DeepSeek Monitor</span>
  </div>
  <div class="logo"> DeepSeek Monitor</div>
  <div class="subtitle">连接到您的 DeepSeek 账户以开始监控</div>

  <div class="form-group">
    <label class="form-label">API Key</label>
    <input type="password" class="form-input" id="apiKeyInput" placeholder="sk-xxxxxxxxxxxxxxxx"
           autocomplete="off" autofocus>
    <div class="form-hint">在 platform.deepseek.com/api_keys 获取</div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-secondary" id="skipBtn">跳过</button>
    <button class="btn btn-primary" id="loginBtn">验证并登录</button>
  </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
