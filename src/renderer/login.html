<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Monitor - 登录</title>
<link rel="stylesheet" href="../shared/palette.css">
<style>
  /* 颜色与主窗、设置窗统一由共享注册表提供，这里只保留登录布局。 */
  html {
    background: transparent;
    overflow: hidden;
    /* 圆角由 DWM 裁剪, CSS 不再画圆角 */
    border-radius: 0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    font-size: 13px;
    background: transparent;
    overflow: hidden;
    height: 100vh;
    display: flex;
    border-radius: 0;
  }
  .container {
    width: 100%;
    height: 100%;
    background: var(--bg-window);
    border-radius: 0;
    box-shadow: var(--shadow-window);
    display: flex;
    flex-direction: column;
    padding: 0 28px 32px;
  }
  .login-titlebar {
    -webkit-app-region: drag;
    padding: 12px 0 8px;
    text-align: center;
    flex-shrink: 0;
  }
  .login-titlebar-text {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .logo {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 4px;
    text-align: center;
  }
  .subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    text-align: center;
    margin-bottom: 24px;
  }
  .form-group { margin-bottom: 16px; }
  .form-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
    display: block;
  }
  .form-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--bg-card);
    outline: none;
    font-family: monospace;
    transition: all 200ms ease-out;
  }
  .form-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px var(--control-focus-ring);
  }
  .form-hint {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .error-msg {
    font-size: 11px;
    color: var(--status-danger-text);
    margin-top: 4px;
    min-height: 16px;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: auto;
  }
  .btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 200ms ease-out;
  }
  .btn-primary {
    background: var(--primary);
    color: var(--text-on-primary);
  }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-primary:disabled { background: var(--control-disabled); cursor: not-allowed; }
  .btn-secondary {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--control-hover); }
</style>
</head>
<body>
<div class="container">
  <div class="login-titlebar">
    <span class="login-titlebar-text">Token Monitor</span>
  </div>
  <div class="logo"> Token Monitor</div>
  <div class="subtitle">可选：连接 DeepSeek 账户以补充余额与用量</div>

  <div class="form-group">
    <label class="form-label">API Key</label>
    <input type="password" class="form-input" id="apiKeyInput" placeholder="sk-xxxxxxxxxxxxxxxx"
           autocomplete="off" autofocus>
    <div class="form-hint">在 platform.deepseek.com/api_keys 获取</div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-secondary" id="skipBtn">跳过</button>
    <button class="btn btn-primary" id="loginBtn">验证并登录</button>
  </div>
</div>
<script src="js/theme-mode-link.js"></script>
<script src="js/login.js"></script>
</body>
</html>
