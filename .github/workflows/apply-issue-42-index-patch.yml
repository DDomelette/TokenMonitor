name: Apply issue 42 index patch

on:
  push:
    branches:
      - fix/issue-42-second-instance-window-focus

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-42-second-instance-window-focus

      - name: Apply deterministic index patch and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('src/main/index.js')
          source = index_path.read_text(encoding='utf-8')

          import_anchor = "const { startScheduler } = require('./core/scheduler');\n"
          import_line = "const { wakeMostRelevantWindow } = require('./core/startup-windows');\n"
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit('startup-windows import anchor not found')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          old_handler = (
              "app.on('second-instance', () => {\n"
              "  if (mainWindow) {\n"
              "    if (mainWindow.isMinimized()) mainWindow.restore();\n"
              "    mainWindow.show();\n"
              "    mainWindow.focus();\n"
              "  }\n"
              "});\n"
          )
          new_handler = (
              "app.on('second-instance', () => {\n"
              "  wakeMostRelevantWindow({\n"
              "    getMainWindow: () => mainWindow,\n"
              "    getLoginWindow: () => loginWindow,\n"
              "    getSettingsWindow: () => settingsWindow\n"
              "  });\n"
              "});\n"
          )
          if new_handler not in source:
              if old_handler not in source:
                  raise SystemExit('second-instance handler anchor not found')
              source = source.replace(old_handler, new_handler, 1)

          index_path.write_text(source, encoding='utf-8')
          Path('.github/workflows/apply-issue-42-index-patch.yml').unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/index.js .github/workflows/apply-issue-42-index-patch.yml
          git commit -m "fix: delegate second-instance window wake policy"
          git push
