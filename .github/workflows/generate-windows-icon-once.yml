name: Generate Windows icon once

on:
  push:
    branches:
      - fix/issue-37-valid-windows-icon

permissions:
  contents: write

jobs:
  generate-icon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-37-valid-windows-icon

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and commit ICO
        run: |
          node scripts/generate-logo.js
          git add assets/icon.ico
          if git diff --cached --quiet; then
            echo "ICO already matches the generator"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: replace fake Windows icon with generated ICO"
          git push origin HEAD:fix/issue-37-valid-windows-icon
