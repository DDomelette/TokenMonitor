name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install renderer dependencies
        run: npm --prefix renderer ci

      - name: Run automated tests
        run: npm test

      - name: Verify fresh-start renderer preparation
        run: |
          rm -rf renderer/dist
          npm run prestart
          test -f renderer/dist/index.html

      - name: Verify macOS icon generation
        run: |
          rm -f assets/icon.icns
          npm run generate:icons
          test -s assets/icon.icns
          node -e "const fs=require('fs');const icon=fs.readFileSync('assets/icon.icns');if(icon.subarray(0,4).toString('ascii')!=='icns'||icon.readUInt32BE(4)!==icon.length)process.exit(1)"

      - name: Install Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64

      - name: Run Electron visibility smoke test
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/ci/component-visibility-smoke.js

      - name: Upload visibility screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-visibility-screenshots
          path: artifacts/component-visibility/*.png
          if-no-files-found: warn

  mac-build-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install renderer dependencies
        run: npm --prefix renderer ci

      - name: Build unsigned macOS package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:mac
