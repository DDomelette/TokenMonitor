name: Apply provider startup integration once

on:
  push:
    branches:
      - fix/issue-38-provider-independent-startup

permissions:
  contents: write

jobs:
  apply-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-38-provider-independent-startup

      - name: Apply deterministic integration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1))

          ipc = Path('src/main/ipc.js')
          replace_once(ipc, """  ipcMain.on('login:submit', async (event, { apiKey }) => {
            const main = getMain();
            try {
              const deepseek = deps.registry.get('deepseek');
              const info = await deepseek.fetchBalance(deepseekApiKeyCtx(deps, apiKey));
              if (!info) throw new Error('API Key 验证失败');
              deps.store.set('providers.deepseek.apiKey', apiKey);
              if (deps.getLoginWindow()) deps.getLoginWindow().close();
              if (!main) deps.createMainWindow();
              else main.show();
              const win = getMain();
              if (win && !win.webContents.isDestroyed()) {
                win.webContents.on('did-finish-load', () => {
                  win.webContents.send('settings:loaded', sanitizeSettings(deps.store.store));
                  deps.scheduler.poll('deepseek', 'balance');
                  deps.createSessionWindow();
                });
              }
            } catch (e) {
              if (deps.getLoginWindow() && !deps.getLoginWindow().isDestroyed()) {
                event.sender.send('login:error', 'API Key 验证失败: ' + e.message);
              }
            }
          });
          """, """  ipcMain.on('login:submit', async (event, { apiKey }) => {
            try {
              const deepseek = deps.registry.get('deepseek');
              const info = await deepseek.fetchBalance(deepseekApiKeyCtx(deps, apiKey));
              if (!info) throw new Error('API Key 验证失败');
              deps.store.set('providers.deepseek.apiKey', apiKey);
              deps.continueWithoutDeepseek();
            } catch (e) {
              if (deps.getLoginWindow() && !deps.getLoginWindow().isDestroyed()) {
                event.sender.send('login:error', 'API Key 验证失败: ' + e.message);
              }
            }
          });

          ipcMain.on('login:skip', () => {
            deps.continueWithoutDeepseek();
          });
          """)

          index = Path('src/main/index.js')
          replace_once(index, """const {
            clearSession,
            expireSession,
            getSessionSnapshot,
            getTraySessionLabel,
            restoreSession
          } = require('./core/session-state');
          """, """const {
            clearSession,
            expireSession,
            getSessionSnapshot,
            getTraySessionLabel,
            restoreSession
          } = require('./core/session-state');
          const {
            chooseInitialWindow,
            continueWithoutDeepseek: continueWithoutDeepseekPolicy,
            initializeMainRenderer
          } = require('./core/provider-startup');
          """)

          replace_once(index, """  loadRenderer(mainWindow);
          """, """  mainWindow.webContents.once('did-finish-load', function () {
            initializeMainRenderer({
              mainWindow,
              store,
              sanitizeSettings: store.sanitizeSettings,
              scheduler,
              runtime,
              restoreSession,
              getSessionSnapshot,
              clearSession,
              createSessionWindow,
              broadcastSessionState,
              updateTrayMenu,
              now: Date.now
            });
          });
          loadRenderer(mainWindow);
          """)

          replace_once(index, """  loginWindow.on('closed', () => {
            loginWindow = null;
          });
          }
          """, """  loginWindow.on('closed', () => {
            loginWindow = null;
          });
          }

          function continueWithoutDeepseek() {
            return continueWithoutDeepseekPolicy({
              getMainWindow: () => mainWindow,
              getLoginWindow: () => loginWindow,
              createMainWindow
            });
          }
          """)

          replace_once(index, """    createMainWindow,
            createLoginWindow,
            createSessionWindow,
          """, """    createMainWindow,
            createLoginWindow,
            continueWithoutDeepseek,
            createSessionWindow,
          """)

          replace_once(index, """  const apiKey = store.get('providers.deepseek.apiKey');
            if (apiKey) {
              createMainWindow();
              mainWindow.webContents.on('did-finish-load', () => {
                mainWindow.webContents.send('settings:loaded', store.sanitizeSettings(store.store));
                scheduler.poll('deepseek', 'balance');

                const storedSessionToken = store.get('providers.deepseek.sessionToken') || null;
                restoreSession(runtime, storedSessionToken);
                if (getSessionSnapshot(runtime).loggedIn) {
                  console.log('[session] startup with stored token, starting usage timer');
                  scheduler.poll('deepseek', 'usage');
                  runtime.proxyStatus = { running: true, port: 0, activeSince: Date.now() };
                } else {
                  console.log('[session] startup without token, opening platform login window');
                  clearSession(runtime, '请登录平台获取用量');
                  runtime.proxyStatus = { running: false, port: 0, error: '请登录平台获取用量' };
                  createSessionWindow();
                }
                broadcastSessionState();
                updateTrayMenu();
              });
            } else {
              createLoginWindow();
            }
          """, """  const initialWindow = chooseInitialWindow({
            deepseekApiKey: store.get('providers.deepseek.apiKey'),
            providerSnapshot: scheduler.getSnapshot()
          });
          if (initialWindow === 'main') createMainWindow();
          else createLoginWindow();
          """)

          replace_once(index, """app.on('activate', () => {
            if (mainWindow) mainWindow.show();
          });
          """, """app.on('activate', () => {
            if (mainWindow && !mainWindow.isDestroyed()) {
              mainWindow.show();
              return;
            }
            if (loginWindow && !loginWindow.isDestroyed()) {
              loginWindow.show();
              return;
            }

            const initialWindow = chooseInitialWindow({
              deepseekApiKey: store.get('providers.deepseek.apiKey'),
              providerSnapshot: scheduler ? scheduler.getSnapshot() : []
            });
            if (initialWindow === 'main') createMainWindow();
            else createLoginWindow();
          });
          """)
          PY

      - name: Commit integration
        run: |
          git add src/main/index.js src/main/ipc.js
          if git diff --cached --quiet; then
            echo "Integration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: decouple startup from DeepSeek credentials"
          git push origin HEAD:fix/issue-38-provider-independent-startup
