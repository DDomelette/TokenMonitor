name: Apply provider startup integration once

on:
  push:
    branches:
      - fix/issue-38-provider-independent-startup

permissions:
  contents: write

jobs:
  apply-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-38-provider-independent-startup

      - name: Apply deterministic integration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(path, start_marker, end_marker, replacement):
              text = path.read_text()
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{path}: start marker not found: {start_marker!r}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{path}: end marker not found: {end_marker!r}')
              if text.find(start_marker, start + len(start_marker)) >= 0:
                  raise SystemExit(f'{path}: start marker is not unique')
              path.write_text(text[:start] + replacement + text[end:])

          def insert_after(path, marker, insertion):
              text = path.read_text()
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: expected one after-marker: {marker!r}')
              path.write_text(text.replace(marker, marker + insertion, 1))

          def insert_before(path, marker, insertion):
              text = path.read_text()
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: expected one before-marker: {marker!r}')
              path.write_text(text.replace(marker, insertion + marker, 1))

          ipc = Path('src/main/ipc.js')
          index = Path('src/main/index.js')
          if "ipcMain.on('login:skip'" in ipc.read_text() and "require('./core/provider-startup')" in index.read_text():
              print('Provider startup integration already applied')
              raise SystemExit(0)

          replace_between(
              ipc,
              "  ipcMain.on('login:submit', async (event, { apiKey }) => {",
              "  /* ======== Dashboard / Providers ======== */",
              """  ipcMain.on('login:submit', async (event, { apiKey }) => {
            try {
              const deepseek = deps.registry.get('deepseek');
              const info = await deepseek.fetchBalance(deepseekApiKeyCtx(deps, apiKey));
              if (!info) throw new Error('API Key 验证失败');
              deps.store.set('providers.deepseek.apiKey', apiKey);
              deps.continueWithoutDeepseek();
            } catch (e) {
              if (deps.getLoginWindow() && !deps.getLoginWindow().isDestroyed()) {
                event.sender.send('login:error', 'API Key 验证失败: ' + e.message);
              }
            }
          });

          ipcMain.on('login:skip', () => {
            deps.continueWithoutDeepseek();
          });

          """
          )

          insert_after(index, "} = require('./core/session-state');\n", """const {
            chooseInitialWindow,
            continueWithoutDeepseek: continueWithoutDeepseekPolicy,
            initializeMainRenderer
          } = require('./core/provider-startup');
          """)

          insert_before(index, "  loadRenderer(mainWindow);", """  mainWindow.webContents.once('did-finish-load', function () {
            initializeMainRenderer({
              mainWindow,
              store,
              sanitizeSettings: store.sanitizeSettings,
              scheduler,
              runtime,
              restoreSession,
              getSessionSnapshot,
              clearSession,
              createSessionWindow,
              broadcastSessionState,
              updateTrayMenu,
              now: Date.now
            });
          });
          """)

          insert_before(index, "// 复用 DeepSeek 平台会话窗口", """function continueWithoutDeepseek() {
            return continueWithoutDeepseekPolicy({
              getMainWindow: () => mainWindow,
              getLoginWindow: () => loginWindow,
              createMainWindow
            });
          }

          """)

          insert_after(index, "    createLoginWindow,\n", "    continueWithoutDeepseek,\n")

          replace_between(
              index,
              "  const apiKey = store.get('providers.deepseek.apiKey');",
              "\n});\n\napp.on('window-all-closed'",
              """  const initialWindow = chooseInitialWindow({
            deepseekApiKey: store.get('providers.deepseek.apiKey'),
            providerSnapshot: scheduler.getSnapshot()
          });
          if (initialWindow === 'main') createMainWindow();
          else createLoginWindow();
          """
          )

          text = index.read_text()
          activate_marker = "app.on('activate', () => {"
          activate = text.find(activate_marker)
          if activate < 0 or text.find(activate_marker, activate + 1) >= 0:
              raise SystemExit('src/main/index.js: activate marker missing or duplicated')
          index.write_text(text[:activate] + """app.on('activate', () => {
            if (mainWindow && !mainWindow.isDestroyed()) {
              mainWindow.show();
              return;
            }
            if (loginWindow && !loginWindow.isDestroyed()) {
              loginWindow.show();
              return;
            }

            const initialWindow = chooseInitialWindow({
              deepseekApiKey: store.get('providers.deepseek.apiKey'),
              providerSnapshot: scheduler ? scheduler.getSnapshot() : []
            });
            if (initialWindow === 'main') createMainWindow();
            else createLoginWindow();
          });
          """)
          PY

      - name: Commit integration
        run: |
          git add src/main/index.js src/main/ipc.js
          if git diff --cached --quiet; then
            echo "Integration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: decouple startup from DeepSeek credentials"
          git push origin HEAD:fix/issue-38-provider-independent-startup
