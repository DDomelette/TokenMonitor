appId: com.deepseek.monitor
productName: DeepSeek Monitor
directories:
  output: build
files:
  - src/**/*
  - renderer/dist/**/*
  - node_modules/**/*
  - package.json
win:
  icon: assets/icon.ico
  target: nsis
mac:
  icon: assets/icon.icns
  target: dmg
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
asarUnpack:
  # koffi 的预编译 FFI 二进制必须在 asar 外才能被加载
  - node_modules/koffi/**/*
extraResources:
  - from: docs/diagnostics
    to: diagnostics-guides
    filter:
      - "**/*.md"
